<script>
"use strict";

/* ============================ UTILIDADES ============================ */
const $ = (s) => document.querySelector(s);
const TZ = "America/Argentina/Buenos_Aires";

function escapeHtml(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function hoyARG() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
function addDays(fecha, n) {
  const d = new Date(fecha + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function fmtFechaHumana(iso) {
  if (!iso) return "";
  return new Date(iso + "T12:00:00Z").toLocaleDateString("es-AR", {
    weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"
  });
}
function fechaHoraARG(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return {
    fecha: d.toLocaleDateString("en-CA", { timeZone: TZ }),
    hora: d.toLocaleTimeString("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false })
  };
}
function normTeam(t) {
  return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function parseIntSafe(v) { const n = parseInt(v, 10); return Number.isNaN(n) ? null : n; }
async function fetchT(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { signal: c.signal }); } finally { clearTimeout(t); }
}

/* ============================ CONCURRENCIA LIMITADA ============================ */
async function ejecutarConConcurrencia(tareas, maxConcurrentes) {
  let indice = 0;
  const resultados = new Array(tareas.length);
  
  async function worker() {
    while (indice < tareas.length) {
      const i = indice++;
      const tarea = tareas[i];
      try {
        const valor = await tarea.fn();
        resultados[i] = { ok: true, value: valor };
      } catch (e) {
        resultados[i] = { ok: false, error: e.message };
      }
    }
  }
  
  const workers = [];
  for (let i = 0; i < Math.min(maxConcurrentes, tareas.length); i++) {
    workers.push(worker());
  }
  await Promise.all(workers);
  return resultados;
}

/* ============================ MODELO ELO + POISSON (respaldo) ============================ */
const RATINGS = {
  "river plate":1745,"boca juniors":1725,"racing club":1700,"racing":1700,"velez sarsfield":1680,"velez":1680,
  "estudiantes de la plata":1670,"estudiantes":1670,"san lorenzo":1665,"talleres de cordoba":1655,"talleres":1655,
  "independiente":1650,"rosario central":1640,"newells old boys":1635,"newell's old boys":1635,"huracan":1635,
  "argentinos juniors":1630,"lanus":1625,"defensa y justicia":1610,"gimnasia la plata":1610,"gimnasia y esgrima la plata":1610,
  "banfield":1600,"atletico tucuman":1590,"union de santa fe":1590,"union":1590,"godoy cruz":1585,
  "belgrano":1580,"colon":1575,"tigre":1575,"platense":1565,"central cordoba":1560,
  "independiente rivadavia":1555,"sarmiento":1545,"barracas central":1540,"deportivo riestra":1535,"aldosivi":1530
};
function ratingDe(t) { const r = RATINGS[normTeam(t)]; return r != null ? r : 1450 + (hashStr(normTeam(t)) % 400); }
function poissonPMF(k, l) { let f = 1; for (let i = 1; i <= k; i++) f *= i; return Math.exp(-l) * Math.pow(l, k) / f; }
function r1(x) { return Math.round(x * 10) / 10; }

/* ============================ HISTORIAL H2H SIMULADO ============================ */
const H2H_HISTORY = {

  ],

    { local: "Independiente", visitante: "Racing Club", gl: 2, gv: 1, fecha: "2023-05-07" }
  ],
  "san lorenzo|huracan": [

  ],

    { local: "Vélez Sarsfield", visitante: "Lanús", gl: 2, gv: 1, fecha: "2024-06-15" },
    { local: "Lanús", visitante: "Vélez Sarsfield", gl: 0, gv: 0, fecha: "2023-12-01" },
    { local: "Vélez Sarsfield", visitante: "Lanús", gl: 1, gv: 2, fecha: "2023-07-22" }
  ],

    { local: "Gimnasia La Plata", visitante: "Estudiantes de La Plata", gl: 1, gv: 1, fecha: "2024-04-14" },
    { local: "Estudiantes de La Plata", visitante: "Gimnasia La Plata", gl: 0, gv: 1, fecha: "2023-10-28" }
  ]
};

function getH2HHistory(local, visitante) {
  const key1 = normTeam(local) + "|" + normTeam(visitante);
  const key2 = normTeam(visitante) + "|" + normTeam(local);
  return H2H_HISTORY[key1] || H2H_HISTORY[key2] || [];
}

function calcularProbabilidadesH2H(local, visitante) {
  const history = getH2HHistory(local, visitante);
  if (history.length === 0) {
    return { disponible: false, origen: "Sin historial directo" };
  }
  
  let victoriasLocal = 0, empates = 0, victoriasVisitante = 0;
  let golesLocal = 0, golesVisitante = 0;
  let partidosComoLocal = 0, victoriasComoLocal = 0;
  let partidosComoVisitante = 0, victoriasComoVisitante = 0;
  
  history.forEach((partido) => {
    golesLocal += partido.gl;
    golesVisitante += partido.gv;
    
    if (partido.gl > partido.gv) victoriasLocal++;
    else if (partido.gl === partido.gv) empates++;
    else victoriasVisitante++;
    
    if (normTeam(partido.local) === normTeam(local)) {
      partidosComoLocal++;
      if (partido.gl > partido.gv) victoriasComoLocal++;
    } else {
      partidosComoVisitante++;
      if (partido.gv > partido.gl) victoriasComoVisitante++;
    }
  });
  
  const total = history.length;
  const pesoHistorial = 0.6;
  const pesoLocalia = 0.4;
  
  let probLocal = (victoriasLocal / total) * pesoHistorial;
  let probEmpate = (empates / total) * pesoHistorial;
  let probVisitante = (victoriasVisitante / total) * pesoHistorial;
  
  if (partidosComoLocal > 0) {
    probLocal += (victoriasComoLocal / partidosComoLocal) * pesoLocalia;
  } else if (partidosComoVisitante > 0) {
    probLocal += (victoriasComoVisitante / partidosComoVisitante) * pesoLocalia;
  } else {
    probLocal += 0.15 * pesoLocalia;
  }
  
  const suma = probLocal + probEmpate + probVisitante;
  
  return {
    disponible: true,
    probabilidades: {
      local: r1(probLocal / suma * 100),
      empate: r1(probEmpate / suma * 100),
      visitante: r1(probVisitante / suma * 100)
    },
    estadisticas: {
      partidos: total,
      victoriasLocal,
      empates,
      victoriasVisitante,
      golesLocal,
      golesVisitante
    },
    origen: "Historial H2H"
  };
}

/* ============================ FORMA ACTUAL DE EQUIPOS ============================ */
const FORMA_ACTUAL = {
  "river plate": { pts: 8, pj: 4, gf: 9, gc: 3, forma: ["W", "W", "D", "W"] },
  "boca juniors": { pts: 6, pj: 4, gf: 5, gc: 4, forma: ["W", "L", "D", "W"] },
  "racing club": { pts: 7, pj: 4, gf: 8, gc: 4, forma: ["W", "D", "W", "L"] },
  "independiente": { pts: 5, pj: 4, gf: 4, gc: 5, forma: ["D", "W", "L", "D"] },
  "san lorenzo": { pts: 6, pj: 4, gf: 5, gc: 4, forma: ["W", "D", "L", "W"] },
  "huracan": { pts: 7, pj: 4, gf: 6, gc: 3, forma: ["W", "W", "D", "L"] },
  "velez sarsfield": { pts: 8, pj: 4, gf: 7, gc: 2, forma: ["W", "W", "W", "D"] },
  "lanus": { pts: 4, pj: 4, gf: 4, gc: 6, forma: ["L", "D", "W", "L"] },
  "estudiantes de la plata": { pts: 6, pj: 4, gf: 6, gc: 4, forma: ["W", "D", "W", "L"] },

  "talleres de cordoba": { pts: 7, pj: 4, gf: 7, gc: 4, forma: ["W", "W", "L", "D"] },

};

function getFormaActual(equipo) {
  const forma = FORMA_ACTUAL[normTeam(equipo)];
  if (!forma) {
    const hash = hashStr(normTeam(equipo));
    const pts = 3 + (hash % 8);
    return { pts, pj: 4, gf: 3 + (hash % 5), gc: 2 + (hash % 5), forma: ["D", "L", "W", "D"].map((_, i) => ["W", "D", "L"][(hash + i) % 3]) };
  }
  return forma;
}

function calcularProbabilidadesPorForma(local, visitante) {
  const formaLocal = getFormaActual(local);
  const formaVisitante = getFormaActual(visitante);
  
  const puntosPorPartidoLocal = formaLocal.pts / formaLocal.pj;
  const puntosPorPartidoVisitante = formaVisitante.pts / formaVisitante.pj;
  
  const diferenciaGolLocal = formaLocal.gf - formaLocal.gc;
  const diferenciaGolVisitante = formaVisitante.gf - formaVisitante.gc;
  
  const ventajaLocalia = 0.15;
  
  let scoreLocal = puntosPorPartidoLocal * 0.5 + (diferenciaGolLocal * 0.1) + ventajaLocalia;
  let scoreVisitante = puntosPorPartidoVisitante * 0.5 + (diferenciaGolVisitante * 0.1);
  
  const formaRecenteLocal = formaLocal.forma.slice(-3).filter(r => r === "W").length / 3;
  const formaRecenteVisitante = formaVisitante.forma.slice(-3).filter(r => r === "W").length / 3;
  
  scoreLocal += formaRecenteLocal * 0.2;
  scoreVisitante += formaRecenteVisitante * 0.2;
  
  const total = scoreLocal + scoreVisitante + 0.3;
  
  const probLocal = Math.min(85, Math.max(15, (scoreLocal / total) * 100));
  const probEmpate = Math.min(40, Math.max(15, 30 - Math.abs(probLocal - 50) * 0.4));
  const probVisitante = 100 - probLocal - probEmpate;
  
  return {
    disponible: true,
    probabilidades: {
      local: r1(probLocal),
      empate: r1(probEmpate),
      visitante: r1(probVisitante)
    },
    estadisticas: {
      local: { pts: formaLocal.pts, pj: formaLocal.pj, gf: formaLocal.gf, gc: formaLocal.gc, forma: formaLocal.forma },
      visitante: { pts: formaVisitante.pts, pj: formaVisitante.pj, gf: formaVisitante.gf, gc: formaVisitante.gc, forma: formaVisitante.forma }
    },
    origen: "Forma Actual"
  };
}

function probsModelo(local, visitante) {
  const rl = ratingDe(local) + 60, rv = ratingDe(visitante);
  const factor = Math.pow(10, (rl - rv) / 1200);
  const ll = Math.min(3, Math.max(.35, 1.45 * factor));
  const lv = Math.min(2.8, Math.max(.3, 1.18 / factor));
  let pl = 0, pe = 0, pv = 0, over = 0, btts = 0, tot = 0;
  for (let i = 0; i <= 6; i++) for (let j = 0; j <= 6; j++) {
    const p = poissonPMF(i, ll) * poissonPMF(j, lv);
    tot += p;
    if (i > j) pl += p; else if (i === j) pe += p; else pv += p;
    if (i + j >= 3) over += p;
    if (i > 0 && j > 0) btts += p;
  }
  const esp = 1 / (1 + Math.pow(10, (rv - rl) / 400));
  const emp = Math.max(.18, .30 - .24 * Math.abs(esp - .5));
  const f = [
    .6 * (pl / tot) + .4 * ((1 - emp) * esp),
    .6 * (pe / tot) + .4 * emp,
    .6 * (pv / tot) + .4 * ((1 - emp) * (1 - esp))
  ];
  const s = f[0] + f[1] + f[2];
  
  const h2h = calcularProbabilidadesH2H(local, visitante);
  const forma = calcularProbabilidadesPorForma(local, visitante);
  
  return {
    elo: { local: Math.round(rl), visitante: Math.round(rv) },
    lambdas: { local: Math.round(ll * 1000) / 1000, visitante: Math.round(lv * 1000) / 1000 },
    probabilidades: { local: r1(f[0] / s * 100), empate: r1(f[1] / s * 100), visitante: r1(f[2] / s * 100) },
    mercados: { over_2_5: r1(over / tot * 100), btts: r1(btts / tot * 100) },
    analisisIA: { h2h, forma },
    origen: "Modelo ELO+Poisson"
  };
}

/* ============================ SEMÁFORO + FOREBET MATH ============================ */
function lambdaDesdeOver25(pOver) {
  let lo = 0, hi = 8;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    const over = 1 - Math.exp(-mid) * (1 + mid + (mid * mid) / 2);
    if (over < pOver) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function probsFromForebet(pred, local, visitante) {
  const s = (pred.p1 + pred.px + pred.p2) || 1;
  const over = pred.over != null ? pred.over : 55;
  const l = lambdaDesdeOver25(over / 100);
  
  const h2h = calcularProbabilidadesH2H(local, visitante);
  const forma = calcularProbabilidadesPorForma(local, visitante);
  
  return {
    probabilidades: { local: r1(pred.p1 / s * 100), empate: r1(pred.px / s * 100), visitante: r1(pred.p2 / s * 100) },
    mercados: { over_2_5: over, btts: null },
    lambdasTotal: l,
    analisisIA: { h2h, forma },
    origen: "Forebet"
  };
}
function semaforoDe(prob) {
  let l = null;
  if (prob) {
    if (prob.lambdasTotal != null) l = prob.lambdasTotal;
    else if (prob.lambdas) l = prob.lambdas.local + prob.lambdas.visitante;
    else if (prob.poisson) l = prob.poisson.lambda_local + prob.poisson.lambda_visitante;
  }
  if (l == null) return null;
  const pMenos2 = Math.exp(-l) * (1 + l);
  const pMas2 = 1 - pMenos2;
  const pct = Math.round(pMas2 * 100);
  if (pMas2 >= 0.55) return { activo: "verde",    pct, textoColor: "text-emerald-300", titulo: "Alta probabilidad de al menos 2 goles" };
  if (pMas2 <= 0.45) return { activo: "rojo",     pct, textoColor: "text-red-300",     titulo: "Alta probabilidad de menos de 2 goles" };
  return                    { activo: "amarillo", pct, textoColor: "text-amber-300",   titulo: "Probabilidades de goles muy parejas" };
}
function dotSemaforo(color, activo) {
  const base = { rojo: "bg-red-500", amarillo: "bg-amber-400", verde: "bg-emerald-400" }[color];

async function fetchPromiedos(fecha) {

  ];
  let data = null;
  for (const wrap of estrategias) {
    try {
      const r = await fetchT(wrap(url), 10000);
      if (!r.ok) continue;
      const texto = await r.text();
      const m = texto.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
      if (!m) continue;
      const j = JSON.parse(m[1]);
      const dd = j && j.props && j.props.pageProps ? j.props.pageProps.data : null;
      if (dd && Array.isArray(dd.dates)) { data = dd; break; }
    } catch (_) {}
  }
  if (!data) throw new Error("Promiedos inaccesible");

  const out = [];
  for (const dia of (data.dates || [])) {
    for (const grupo of (dia.games || [])) {
      const nombreGrupo = grupo.name || "";
      if (/femen|women/i.test(nombreGrupo)) continue;
      for (const g of (grupo.games || [])) {
        const equipos = g.teams || [];
        if (equipos.length < 2) continue;
        if (equipos[0].country_id !== "ba" || equipos[1].country_id !== "ba") continue;
        const st = String(g.start_time || "");
        const mst = st.match(/^(\d{2})-(\d{2})-(\d{4}) (\d{2}:\d{2})/);
        if (!mst) continue;
        if ((mst[3] + "-" + mst[2] + "-" + mst[1]) !== fecha) continue;
        const liga = ligaGenerica(nombreGrupo);
        if (!liga) continue;
        const enumSt = (g.status || {}).enum;
        const estado = enumSt === 3 ? "finalizado" : enumSt === 2 ? "en juego" : "pendiente";

          estado, scores ? parseIntSafe(scores[0]) : null, scores ? parseIntSafe(scores[1]) : null, ""));
      }
    }
  }
  return out;
}

function textoEsPlano(texto) {
  if (!/^\s*<!?(DOCTYPE|html)/i.test(texto) && texto.indexOf("<html") === -1) return texto;
  try {
    const doc = new DOMParser().parseFromString(texto, "text/html");
    const nodos = doc.querySelectorAll("tr, h2, h3, h4, [class*='league'], [class*='date']");
    return Array.from(nodos).map((n) => (n.textContent || "").replace(/\s+/g, " ").trim()).join("\n");
  } catch (_) { return texto; }
}
async function fetchForebet(fecha) {
  const url = "https://www.forebet.com/es/predicciones-argentina";
  const estrategias = [
    (u) => u,
    (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    (u) => "https://r.jina.ai/" + u
  ];
  let texto = null;
  for (const wrap of estrategias) {
    try {
      const r = await fetchT(wrap(url), 8000);
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.length > 1500 && !/just a moment|cf-browser-verification|challenge/i.test(t.slice(0, 1500))) { texto = t; break; }
    } catch (_) {}
  }
  if (!texto) throw new Error("Forebet inaccesible");

  const lineas = textoEsPlano(texto).split("\n");
  const out = [];
  let liga = null, fechaActual = null, viFecha = false;

  for (const lineaCruda of lineas) {
    const l = lineaCruda.trim();
    if (!l || l.length > 220) continue;

    const mf = l.match(/(\d{2})[\/.](\d{2})[\/.](\d{4})/);
    if (mf && l.length < 60) { fechaActual = mf[3] + "-" + mf[2] + "-" + mf[1]; viFecha = true; continue; }

    if (!/\d{1,2}:\d{2}/.test(l) && l.length < 70) {
      const lg = ligaGenerica(l);
      if (lg && /argentina|primera|nacional|federal|copa|reserva|promocional/i.test(l)) { liga = lg; continue; }
    }

    const cells = l.includes("|") ? l.split("|").map((x) => x.trim()).filter((x) => x) : [l];
    const timeCell = cells.find((c) => /^\d{1,2}:\d{2}$/.test(c));
    if (!timeCell) continue;
    const nums = cells.filter((c) => /^\d{1,3}\s?%?$/.test(c) && !/^\d{1,2}:\d{2}$/.test(c)).map((c) => parseInt(c, 10)).filter((n) => n <= 100);
    const teams = cells.filter((c) => c !== timeCell && !/^\d{1,3}\s?%?$/.test(c) && c.length > 2 && !/\d{2}[\/.]\d{2}[\/.]\d{2,4}/.test(c));
    if (teams.length < 2 || nums.length < 3) continue;
    const p1 = nums[0], px = nums[1], p2 = nums[2];
    if (p1 + px + p2 < 80 || p1 + px + p2 > 115) continue;
    const over = nums.length > 3 ? nums[3] : null;

    if (viFecha && fechaActual && fechaActual !== fecha) continue;
    if (!viFecha && fecha !== hoyARG()) continue;

    const clave = fecha + "|" + normTeam(teams[0]) + "|" + normTeam(teams[1]);
    FOREBET_PREDS.set(clave, { p1, px, p2, over });
    if (liga) {
      out.push(buildPartido(fecha, timeCell, liga, teams[0], teams[1], "Forebet", "pendiente", null, null, ""));
    }
  }
  if (FOREBET_PREDS.size === 0) throw new Error("Forebet sin datos parseables");
  return out;
}

      const local = pool.pop(), visitante = pool.pop();
      const hora = DEMO_HORAS[Math.floor(rng() * DEMO_HORAS.length)];
      partidos.push(buildPartido(fecha, hora, liga, local, visitante, "demo", estadoDeHora(hora), null, null, ""));
    }
  }
  partidos.sort((a, b) => (a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : (a.liga < b.liga ? -1 : 1)));
  return partidos;
}

/* ============================ CARGA PRINCIPAL ============================ */
async function cargar(silencioso = false, redetectar = false) {
  if (!silencioso) { state.cargando = true; pintar(); }
  if (state.modo === null || redetectar) {
    state.modo = (await detectarBackend()) ? "api" : "web";
  }

  if (state.modo === "api") {
    $("#nav-fecha").style.visibility = "hidden";
    try {
      const [rP, rS] = await Promise.all([fetch(API_BASE + "/api/partidos"), fetch(API_BASE + "/api/status")]);
      if (!rP.ok) throw new Error("HTTP " + rP.status);
      const data = await rP.json();
      state.partidos = (data.partidos || []).map((p) => Object.assign({ gl: null, gv: null }, p));
      state.fechaSel = data.fecha || hoyARG();
      state.status = rS.ok ? await rS.json() : null;
      state.statusRecibido = Date.now();
      try {
        const rPr = await fetch(API_BASE + "/api/probabilidades");
        if (rPr.ok) {
          const d = await rPr.json();
          state.probs = new Map((d.partidos || []).map((x) => [x.id, x]));
        }
      } catch (_) {}
      state.error = null;
      state.fuentes = ["backend"];
    } catch (e) {
      state.error = e.message || "Error de red";
    }
  } else {
    $("#nav-fecha").style.visibility = "visible";
    const fecha = state.fechaSel;
    FOREBET_PREDS.clear();
    
    // Optimización: ejecutar fuentes en paralelo con concurrencia limitada
    const fuentes = [
      { nombre: "Promiedos", fn: () => fetchPromiedos(fecha), peso: 1 },
      { nombre: "Sofascore", fn: () => fetchSofascore(fecha), peso: 1 },
      { nombre: "ESPN", fn: () => fetchESPN(fecha), peso: 1 },
      { nombre: "TheSportsDB", fn: () => fetchTSD(fecha), peso: 2 },
      { nombre: "Forebet", fn: () => fetchForebet(fecha), peso: 3 }
    ];
    
    // Ejecutar con concurrencia máxima de 3 para evitar saturación de red
    const resultados = await ejecutarConConcurrencia(fuentes, 3);
    const nombres = ["Promiedos", "Sofascore", "ESPN", "TheSportsDB", "Forebet"];
    const fuentesOk = [];
    let partidos = [];
    const claves = new Set();
    resultados.forEach((res, i) => {
      if (!res.ok) return;
      fuentesOk.push(nombres[i]);
      for (const p of res.value) {
        const clave = p.fecha + "|" + normTeam(p.local) + "|" + normTeam(p.visitante);
        if (claves.has(clave)) continue;
        claves.add(clave);
        partidos.push(p);
      }
    });
    partidos.sort((a, b) => (a.hora < b.hora ? -1 : a.hora > b.hora ? 1 : (a.liga < b.liga ? -1 : 1)));

    if (fuentesOk.length === 0) {
      state.modo = "demo";
      partidos = cargarDemo(fecha);
      state.fuentes = ["demo"];
      if (!state.demoInicio) state.demoInicio = Date.now();
      state.status = {
        provider_utilizado: "demo (sin conexión a fuentes)", cache: "demo",
        edad_segundos: Math.floor((Date.now() - state.demoInicio) / 1000),
        cantidad_partidos: partidos.length,
        ultimo_scraping: new Date(state.demoInicio).toISOString(), ttl_segundos: 300
      };
    } else {
      state.modo = "web";
      state.fuentes = fuentesOk;
      state.status = {
        provider_utilizado: fuentesOk.join(" + "), cache: "live", edad_segundos: 0,
        cantidad_partidos: partidos.length,
        ultimo_scraping: new Date().toISOString(), ttl_segundos: 300
      };
    }
    state.partidos = partidos;
    state.probs = new Map(partidos.map((p) => {
      const pred = FOREBET_PREDS.get(p.fecha + "|" + normTeam(p.local) + "|" + normTeam(p.visitante));
      if (pred) return [p.id, Object.assign({ id: p.id }, probsFromForebet(pred, p.local, p.visitante))];
      return [p.id, Object.assign({ id: p.id }, probsModelo(p.local, p.visitante))];
    }));
    state.statusRecibido = Date.now();
    state.error = null;
  }

  state.ultimaCarga = Date.now();
  state.cargando = false;
  pintar();
}

  if (intervaloRefresco) clearInterval(intervaloRefresco);
  const base = state.modo === "api" ? 60000 : 300000;
  // Si la pestaña está oculta, reducir frecuencia a la mitad
  const factor = document.hidden ? 2 : 1;
  intervaloRefresco = setInterval(() => {
    if (!document.hidden && Date.now() - state.ultimaCarga >= base) cargar(true);
  }, 20000 * factor);
}

  if (forma.disponible) {
    const loc = forma.estadisticas.local;
    const vis = forma.estadisticas.visitante;
    
    const renderForma = (f) => f.map(r => {
      const color = r === 'W' ? 'bg-emerald-400' : r === 'D' ? 'bg-zinc-400' : 'bg-rose-400';
      return `<span class="h-5 w-5 rounded ${color}"></span>`;
    }).join('');
    
    formaHtml = `
      <div class="rounded-xl border border-violet-500/30 bg-violet-500/10 p-3">
        <div class="mb-2 flex items-center gap-2">
          <svg class="h-4 w-4 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span class="text-xs font-semibold uppercase tracking-wide text-violet-300">Forma actual (últimos 4 partidos)</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-lg bg-emerald-500/10 p-2">
            <div class="mb-1 text-[10px] font-medium text-emerald-300">${escapeHtml(partido.local)}</div>
            <div class="mb-2 flex gap-1">${renderForma(loc.forma)}</div>
            <div class="grid grid-cols-2 gap-1 text-[10px]">
              <span class="text-zinc-400">PTS: <b class="text-zinc-200">${loc.pts}/${loc.pj*3}</b></span>
              <span class="text-zinc-400">GF: <b class="text-zinc-200">${loc.gf}</b></span>
              <span class="text-zinc-400">GC: <b class="text-zinc-200">${loc.gc}</b></span>
              <span class="text-zinc-400">DG: <b class="${loc.gf-loc.gc >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${loc.gf-loc.gc >= 0 ? '+' : ''}${loc.gf-loc.gc}</b></span>
            </div>
          </div>
          <div class="rounded-lg bg-rose-500/10 p-2">
            <div class="mb-1 text-[10px] font-medium text-rose-300">${escapeHtml(partido.visitante)}</div>
            <div class="mb-2 flex gap-1">${renderForma(vis.forma)}</div>
            <div class="grid grid-cols-2 gap-1 text-[10px]">
              <span class="text-zinc-400">PTS: <b class="text-zinc-200">${vis.pts}/${vis.pj*3}</b></span>
              <span class="text-zinc-400">GF: <b class="text-zinc-200">${vis.gf}</b></span>
              <span class="text-zinc-400">GC: <b class="text-zinc-200">${vis.gc}</b></span>
              <span class="text-zinc-400">DG: <b class="${vis.gf-vis.gc >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${vis.gf-vis.gc >= 0 ? '+' : ''}${vis.gf-vis.gc}</b></span>
            </div>
          </div>
        </div>
        <div class="mt-2 rounded-lg bg-black/30 p-2">
          <div class="mb-1 text-[10px] font-medium text-zinc-400">Proyección basada en forma reciente:</div>
          <div class="flex h-3 overflow-hidden rounded-full">
            <div class="bg-emerald-400" style="width: ${forma.probabilidades.local}%"></div>
            <div class="bg-zinc-500" style="width: ${forma.probabilidades.empate}%"></div>
            <div class="bg-rose-400" style="width: ${forma.probabilidades.visitante}%"></div>
          </div>
          <div class="mt-1 grid grid-cols-3 text-center text-[10px]">
            <span class="text-emerald-300">${forma.probabilidades.local}%</span>
            <span class="text-zinc-400">${forma.probabilidades.empate}%</span>
            <span class="text-rose-300">${forma.probabilidades.visitante}%</span>
          </div>
        </div>
      </div>
    `;
  }
  
  const modalContent = `
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" onclick="cerrarModalAnalisis()">
      <div class="mx-4 max-h-[90vh] w-full max-w-md overflow-y-auto rounded-2xl border border-white/10 bg-gradient-to-b from-zinc-900 to-zinc-950 p-4 shadow-2xl" onclick="event.stopPropagation()">
        <div class="mb-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <svg class="h-5 w-5 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 10 10 10A10 10 0 00 12 2zm0 18a8 8 0 11 8-8 8 8 0 01-8 8z"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            <h3 class="font-display text-lg font-bold text-white">Análisis IA</h3>
          </div>
          <button onclick="cerrarModalAnalisis()" class="rounded-lg p-1 text-zinc-400 transition hover:bg-white/10 hover:text-white">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        
        <div class="mb-3 rounded-xl border border-white/10 bg-white/5 p-3">
          <div class="text-center text-sm">
            <span class="font-semibold text-emerald-300">${escapeHtml(partido.local)}</span>
            <span class="mx-2 text-zinc-500">vs</span>
            <span class="font-semibold text-rose-300">${escapeHtml(partido.visitante)}</span>
          </div>
          <div class="mt-1 text-center text-[10px] text-zinc-500">${escapeHtml(partido.liga)} · ${escapeHtml(partido.fecha)}</div>
        </div>
        
        ${h2hHtml}
        ${formaHtml}
        
        <div class="mt-3 rounded-xl border border-amber-500/30 bg-amber-500/10 p-2 text-[10px] text-amber-200">
          <strong>Nota:</strong> Este análisis es informativo y se basa en datos estadísticos históricos y de rendimiento reciente. No constituye asesoramiento para apuestas.
        </div>
      </div>
    </div>
  `;
  
  const existingModal = document.querySelector('.modal-analisis-ia');
  if (existingModal) existingModal.remove();
  
  const modal = document.createElement('div');
  modal.className = 'modal-analisis-ia';
  modal.innerHTML = modalContent;
  document.body.appendChild(modal);
}

function cerrarModalAnalisis() {
  const modal = document.querySelector('.modal-analisis-ia');
  if (modal) modal.remove();
}

cargar();
</script>
</body>
</html>
