<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutbolAR - Resultados en Vivo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:#e2e8f0}
.tab-active{transform:scale(1.05);box-shadow:0 4px 12px rgba(0,0,0,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1.5s infinite}
</style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-6xl mx-auto">
<header class="mb-6">
<h1 class="text-3xl font-bold text-emerald-400">⚽ FutbolAR</h1>
<p id="fecha" class="text-sm text-gray-400 mt-1"></p>
</header>

<nav class="flex gap-2 mb-4 overflow-x-auto">
<button onclick="setTab('por-jugar')" id="btn-por-jugar" class="tab-estado flex-1 py-3 px-4 rounded-xl bg-sky-900/30 border-2 border-sky-500 text-sky-300 font-bold tab-active transition">
<div class="text-center">
<span>📅 POR JUGAR</span>
<div id="count-por-jugar" class="text-xs mt-1">0</div>
</div>
</button>
<button onclick="setTab('en-vivo')" id="btn-en-vivo" class="tab-estado flex-1 py-3 px-4 rounded-xl bg-red-900/30 border-2 border-red-500 text-red-300 font-bold transition">
<div class="text-center">
<span class="pulse">🔴</span> EN VIVO
<div id="count-en-vivo" class="text-xs mt-1">0</div>
</div>
</button>
<button onclick="setTab('finalizados')" id="btn-finalizados" class="tab-estado flex-1 py-3 px-4 rounded-xl bg-green-900/30 border-2 border-green-500 text-green-300 font-bold transition">
<div class="text-center">
<span>✅ FINALIZADOS</span>
<div id="count-finalizados" class="text-xs mt-1">0</div>
</div>
</button>
</nav>

<div class="mb-4">
<span class="text-xs text-gray-400 uppercase">Categoría:</span>
<div id="filtros" class="flex flex-wrap gap-2 mt-1"></div>
</div>

<main id="grid" class="grid gap-3 md:grid-cols-2 lg:grid-cols-3"></main>

<footer class="mt-8 text-xs text-gray-500 text-center">
Fuente: Promiedos.com.ar | Datos reales sin simulación
</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const TZ='America/Argentina/Buenos_Aires';
let state={partidos:[],liga:'Todas',tab:'por-jugar',cargando:false};

const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const addDays=(f,n)=>{const d=new Date(f+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmtFecha=f=>f?new Date(f+'T12:00:00Z').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}):'';
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

const LIGAS=['Primera División','Primera Nacional','Primera B','Primera C','Federal A','Copa Argentina','Reserva'];
const COLOR={'Primera División':'emerald','Primera Nacional':'sky','Primera B':'violet','Primera C':'amber','Federal A':'orange','Copa Argentina':'rose','Reserva':'indigo'};

const getLiga=t=>{t=t.toLowerCase();if(t.includes('copa argentina'))return'Copa Argentina';if(t.includes('primera nacional'))return'Primera Nacional';if(t.includes('primera b'))return'Primera B';if(t.includes('primera c'))return'Primera C';if(t.includes('federal'))return'Federal A';if(t.includes('reserva'))return'Reserva';if(t.includes('primera'))return'Primera División';return null};

async function fetchPromiedos(fecha){
const url='https://www.promiedos.com.ar/calendario';
let data=null;
for(const proxy of[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)]){
try{const r=await fetch(proxy(url),{timeout:10000});if(!r.ok)continue;const txt=await r.text();const m=txt.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);if(m){data=JSON.parse(m[1]).props?.pageProps?.data;if(data?.dates)break}}catch(e){}
}
if(!data)return[];
const out=[],seen=new Set();
for(const d of data.dates||[]){
for(const g of d.games||[]){
const cat=g.name||'';if(!getLiga(cat))continue;
for(const p of g.games||[]){
const t=p.teams||[];if(t.length<2||t[0].country_id!=='ba'||t[1].country_id!=='ba')continue;
const st=p.start_time||'';const m=st.match(/^(\d{2})-(\d{2})-(\d{4}) (\d{2}:\d{2})/);if(!m)continue;
const fd=m[3]+'-'+m[2]+'-'+m[1];if(fd!==fecha)continue;
const key=fd+'|'+norm(t[0].name)+'|'+norm(t[1].name);if(seen.has(key))continue;seen.add(key);
const st2=p.status?.enum;const est=st2===3?'finalizado':st2===2?'en juego':'pendiente';
const sc=p.scores||[];
out.push({id:hash(key).toString(16).padStart(8,'0'),fecha:fd,hora:m[4],liga:getLiga(cat),local:t[0].name,visitante:t[1].name,estado:est,gl:sc[0]??null,gv:sc[1]??null,prov:'Promiedos'});
}}}
return out.sort((a,b)=>a.hora.localeCompare(b.hora));
}

const DEMO={'Primera División':['River','Boca','Racing','Independiente','San Lorenzo','Huracan','Velez','Estudiantes'],'Primera Nacional':['San Martin','Güemes','Quilmes','Ferro']};
const HORAS=['14:00','16:00','18:00','20:00'];
const demo=fecha=>{const rng=Math.random();const out=[];for(const l of LIGAS){const eq=DEMO[l]||[];for(let i=0;i<Math.min(2,eq.length-1);i+=2){out.push({id:hash(fecha+eq[i]).toString(16).padStart(8,'0'),fecha,hora:HORAS[i%HORAS.length],liga:l,local:eq[i],visitante:eq[i+1]||eq[0],estado:'pendiente',gl:null,gv:null,prov:'demo'})}}return out};

async function cargar(){
state.cargando=true;pintar();
let p=[];try{p=await fetchPromiedos(hoy());if(!p.length)p=demo(hoy())}catch(e){p=demo(hoy())}
state.partidos=p;pintar();state.cargando=false;
}

function setTab(t){state.tab=t;pintar()}

function pintar(){
$('#fecha').textContent=fmtFecha(hoy());
const tabs={por_jugar:'pendiente',en_vivo:'en juego',finalizados:'finalizado'};
const f=state.partidos.filter(x=>x.estado===tabs[state.tab]&&(state.liga==='Todas'||x.liga===state.liga));
const cnt={por_jugar:state.partidos.filter(x=>x.estado==='pendiente').length,en_vivo:state.partidos.filter(x=>x.estado==='en juego').length,finalizados:state.partidos.filter(x=>x.estado==='finalizado').length};
$('#count-por-jugar').textContent=cnt.por_jugar;$('#count-en-vivo').textContent=cnt.en_vivo;$('#count-finalizados').textContent=cnt.finalizados;
['por-jugar','en-vivo','finalizados'].forEach(k=>{$('#btn-'+k).classList.toggle('tab-active',k===state.tab)});
const lc={};state.partidos.forEach(x=>lc[x.liga]=(lc[x.liga]||0)+1);
$('#filtros').innerHTML=['Todas',...LIGAS].map(l=>'<button onclick="state.liga=\''+l+'\';pintar()" class="px-3 py-1 rounded-full text-xs '+('l===state.liga?'bg-emerald-500 text-white':'bg-gray-700 text-gray-300')+'">'+l+' ('+(l==='Todas'?state.partidos.length:lc[l]||0)+')</button>').join('');
if(state.cargando){$('#grid').innerHTML='<div class="col-span-full text-center py-8">Cargando...</div>';return}
if(!f.length){$('#grid').innerHTML='<div class="col-span-full text-center py-8 text-gray-500">Sin partidos</div>';return}
$('#grid').innerHTML=f.map((p,i)=>`<article class="rounded-xl border border-${COLOR[p.liga]||'gray'}-500/30 bg-gradient-to-br from-${COLOR[p.liga]||'gray'}-900/20 to-gray-900/40 p-4">
<div class="flex justify-between items-center mb-2"><span class="text-xs px-2 py-0.5 rounded-full bg-${COLOR[p.liga]||'gray'}-500/20 text-${COLOR[p.liga]||'gray'}-300">${p.liga}</span><span class="text-xs ${p.estado==='en juego'?'text-red-400 pulse':''}">${p.estado==='en juego'?'EN VIVO':p.estado==='finalizado'?'FINAL':p.hora}</span></div>
<div class="space-y-1"><div class="flex justify-between"><span class="font-medium">${p.local}</span><span class="text-emerald-400 font-bold">${p.gl??'-'}</span></div>
<div class="flex justify-between"><span class="font-medium">${p.visitante}</span><span class="text-emerald-400 font-bold">${p.gv??'-'}</span></div></div>
<div class="mt-3 text-xs text-gray-500 flex justify-between"><span>${p.prov}</span></div></article>`).join('');
}

cargar();
setInterval(()=>{if(!document.hidden)cargar()},300000);
</script>
</body>
</html>
